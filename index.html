<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タイムカード</title><style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#eef2f6;color:#182638;margin:0;padding:12px}main{max-width:1100px;margin:auto;background:white;padding:14px}h1{text-align:center;font-size:22px}header,footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}input,select,button{font:inherit;border:1px solid #aab5c3;border-radius:4px;background:white;padding:6px;color:inherit}button{background:#31577a;color:white;padding:10px 20px}table{border-collapse:collapse;width:100%;min-width:960px;table-layout:fixed}td,th{border:1px solid #999;text-align:center;padding:3px}th{background:#eee}td input,td select{width:100%;min-width:0;padding:4px 0} .pair{display:flex;align-items:center;gap:2px}.pair select{flex:1;width:0}.scroll{overflow-x:auto} .printval{display:none}footer{border:1px solid #999;padding:12px;justify-content:space-between} @page{size:A4 portrait;margin:8mm}@media print{body,main{padding:0;margin:0;background:white;color:black}h1{font-size:15pt;margin:0 0 3mm}header,footer{margin:2mm 0;padding:2mm;font-size:9pt}table{min-width:0;width:100%;font-size:8pt}td,th{padding:0 1px;height:6.7mm}th{height:8mm}input,select,.pair,button,.note{display:none!important}.printval{display:inline!important}.scroll{overflow:visible}footer{break-inside:avoid}tr{break-inside:avoid}}.manager{max-width:750px;margin:auto;background:white;padding:20px;border-radius:12px}.manager h2{font-size:18px}.manager details{border-bottom:1px solid #ddd;padding:12px 0}.manager summary{cursor:pointer;font-weight:bold;font-size:17px}.record{display:flex;gap:8px;align-items:center;margin:8px 0}.record button:first-child{flex:1;text-align:left}.muted{background:#657587}.danger{background:#a33}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}[hidden]{display:none!important}@media print{.manager,.toolbar{display:none!important}}</style><section id="manager" class="manager" hidden><h1>タイムカード管理</h1><div class="toolbar"><button id="new">＋ 新規タイムカード</button><button id="backup" class="muted">バックアップ</button><button id="restore" class="muted">復元</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div><h2>保存済みスタッフ</h2><div id="staffList"></div><p id="homeStatus" role="status"></p></section><main id="editor" hidden><div class="toolbar"><button id="back" class="muted">← 保存一覧</button><button id="saveCard">保存する</button></div><h1>アルバイト タイムカード</h1><header><label>年 <select id="y"></select><span class="printval" id="py"></span></label><label>月 <select id="m"></select><span class="printval" id="pm"></span></label><label>氏名 <input id="name" placeholder="氏名" readonly><span class="printval" id="pn"></span></label><button id="print">A4印刷</button></header><div class="scroll"><table><colgroup><col style="width:4%"><col style="width:4%"><col style="width:9%"><col style="width:25%"><col style="width:7%"><col style="width:8%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:18%"></colgroup><thead><tr><th>日</th><th>曜日</th><th>店舗</th><th>出勤・退勤</th><th>休憩</th><th>実働時間</th><th>欠勤</th><th>早退</th><th>遅刻</th><th>早朝</th><th>残業</th><th>交通費（区間・金額）</th></tr></thead><tbody id="rows"></tbody></table></div><footer><span>出勤日数 <b id="count">0日</b></span><span>実働合計 <b id="total">0時間00分</b></span><span>交通費合計 <b id="fare">0円</b></span><label>確認者 <input id="checker"><span class="printval" id="pc"></span></label></footer><p class="note">横にスクロールして入力できます。データはこのブラウザ内に保存されます。早退・遅刻・早朝・残業欄は記録用で、実働時間に重複加算しません。</p><p id="status" class="note"></p></main><script>
const $=id=>document.getElementById(id), now=new Date(), pad=n=>String(n).padStart(2,'0'), range=(a,b)=>Array.from({length:b-a+1},(_,i)=>i+a);
let db={};try{db=JSON.parse(localStorage.getItem('timecard-v3')||'{}')}catch(e){$('status').textContent='保存データを読み込めませんでした'}
function save(){if(window.cloudSave){window.cloudSave();return;}try{localStorage.setItem('timecard-v3',JSON.stringify(db));$('homeStatus').textContent='';$('status').textContent=''}catch(e){$('status').textContent=$('homeStatus').textContent='自動保存できません。バックアップして保管してください。'}}
function opts(el,values,blank=false){if(blank)el.add(new Option('―',''));values.forEach(v=>el.add(new Option(v,v)))}
opts($('y'),range(2020,2040));opts($('m'),range(1,12));$('y').value=now.getFullYear();$('m').value=now.getMonth()+1;
let current;function key(){return JSON.stringify([$('y').value,$('m').value,$('name').value.trim()])}
function fmt(n){return Math.floor(n/60)+'時間'+pad(n%60)+'分'}
function render(){current=db[key()]||(db[key()]={days:{},checker:''});$('checker').value=current.checker||'';$('rows').replaceChildren();$('py').textContent=$('y').value+'年';$('pm').textContent=$('m').value+'月';$('pn').textContent=$('name').value;$('pc').textContent=$('checker').value;let y=+$('y').value,m=+$('m').value;for(let d=1;d<=new Date(y,m,0).getDate();d++){let r=current.days[d]||(current.days[d]={}),tr=$('rows').insertRow();tr.insertCell().textContent=d;tr.insertCell().textContent='日月火水木金土'[new Date(y,m-1,d).getDay()];function field(parent,k,values,type='text'){let el=document.createElement(values?'select':'input');if(values)opts(el,values,true);else el.type=type;el.value=r[k]??'';let p=document.createElement('span');p.className='printval';p.textContent=el.value;parent.append(el,p);el.addEventListener('input',()=>{r[k]=el.value;p.textContent=el.value;save();calc()});return el}
field(tr.insertCell(),'store',['Lucia','Glanz','Sara']);let c=tr.insertCell(),pair=document.createElement('div');pair.className='pair';c.append(pair);for(let k of ['sh','sm','eh','em']){if(k==='sm'||k==='em')pair.append(':');if(k==='eh')pair.append('〜');field(pair,k,range(0,k.endsWith('h')?23:59).map(pad))}let p=document.createElement('span');p.className='printval';p.id='time'+d;c.append(p);field(tr.insertCell(),'rest',range(0,120).map(String));tr.insertCell().id='work'+d;field(tr.insertCell(),'absent',['欠']);for(let k of ['early','late','before','over'])field(tr.insertCell(),k,range(0,180).map(String));let f=tr.insertCell();field(f,'route');field(f,'fare',null,'number')}calc()}
function calc(){let count=0,total=0,fare=0;for(let [d,r] of Object.entries(current.days)){let w=$('work'+d);if(!w)continue;let t=$('time'+d);t.textContent=[r.sh,r.sm,r.eh,r.em].every(v=>v!=null&&v!=='')?r.sh+':'+r.sm+'〜'+r.eh+':'+r.em:'';let complete=[r.sh,r.sm,r.eh,r.em].every(v=>v!=null&&v!=='');let n=(+r.eh-+r.sh)*60+(+r.em-+r.sm)-Number(r.rest||0);w.textContent='';if(complete&&!r.absent){if(n>0){count++;total+=n;w.textContent=Math.floor(n/60)+':'+pad(n%60)}else w.textContent='要確認'}fare+=Math.max(0,Number(r.fare)||0)}$('count').textContent=count+'日';$('total').textContent=fmt(total);$('fare').textContent=fare.toLocaleString()+'円'}
$('y').onchange=$('m').onchange=$('name').onchange=render;$('checker').oninput=()=>{current.checker=$('checker').value;$('pc').textContent=current.checker;save()};$('print').onclick=()=>{save();window.print()};
function entries(){return Object.entries(db).flatMap(([k,v])=>{try{let [y,m,n]=JSON.parse(k);return n&&v&&v.days?[{k,y,m,n,v}]:[]}catch(e){return []}})}
function home(){ $('editor').hidden=true;$('manager').hidden=false;let list=$('staffList');list.replaceChildren();let groups=new Map();for(let e of entries()){if(!groups.has(e.n))groups.set(e.n,[]);groups.get(e.n).push(e)}if(!groups.size)list.textContent='保存済みのタイムカードはありません';for(let [n,items] of [...groups].sort((a,b)=>a[0].localeCompare(b[0],'ja'))){let det=document.createElement('details');det.open=true;let sum=document.createElement('summary');sum.textContent=n+'（'+items.length+'件）';det.append(sum);for(let e of items.sort((a,b)=>Number(b.y)*12+Number(b.m)-Number(a.y)*12-Number(a.m))){let row=document.createElement('div');row.className='record';let open=document.createElement('button');open.textContent=e.y+'年'+e.m+'月　編集';open.onclick=()=>edit(e.n,e.y,e.m);let del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm(e.n+' '+e.y+'年'+e.m+'月を削除しますか？')){delete db[e.k];save();home()}};row.append(open,del);det.append(row)}list.append(det)}}
function edit(n,y,m){$('name').value=n;$('y').value=y;$('m').value=m;$('manager').hidden=true;$('editor').hidden=false;render();save();window.scrollTo(0,0)}
$('new').onclick=()=>{let n=prompt('スタッフ氏名を入力してください');if(n&&n.trim())edit(n.trim(),String(now.getFullYear()),String(now.getMonth()+1))};
$('back').onclick=()=>{save();home()};$('saveCard').onclick=()=>{save();home()};
$('y').onchange=$('m').onchange=()=>{render();save()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,data:db})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='timecard-backup-'+now.toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async()=>{try{let file=$('restoreFile').files[0];if(!file)return;let b=JSON.parse(await file.text());if(b.version!==1||!b.data||typeof b.data!=='object'||Array.isArray(b.data))throw Error();let imported={};for(let [k,v] of Object.entries(b.data)){let a=JSON.parse(k);if(!Array.isArray(a)||a.length!==3||!/^\d{4}$/.test(a[0])||+a[1]<1||+a[1]>12||typeof a[2]!=='string'||!v||typeof v.days!=='object'||!v.days||Array.isArray(v.days))throw Error();for(let r of Object.values(v.days))if(!r||typeof r!=='object'||Array.isArray(r))throw Error();imported[k]=v}if(confirm('バックアップを復元します。同じ氏名・年月の記録は上書きします。')){db={...db,...imported};save();home();$('homeStatus').textContent='復元しました'}}catch(e){alert('バックアップファイルを読み込めませんでした')}finally{$('restoreFile').value=''}};

</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {getAuth,signInAnonymously,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,onSnapshot,deleteDoc,writeBatch,FieldPath,updateDoc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const panel=document.createElement('section');panel.style.cssText='max-width:750px;margin:12px auto;padding:16px;background:white;border-radius:12px;overflow-wrap:anywhere';document.body.prepend(panel);panel.textContent='端末認証を確認中…';
try{
const app=initializeApp({apiKey:"AIzaSyDrvkCbDnknpY3Ki6-KW8vOnaoeOe2YdLI",authDomain:"timecard-app-65b7b.firebaseapp.com",projectId:"timecard-app-65b7b",storageBucket:"timecard-app-65b7b.firebasestorage.app",messagingSenderId:"667529800002",appId:"1:667529800002:web:92ccfa14beec90933080db"});
const auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);await auth.authStateReady();const user=auth.currentUser||(await signInAnonymously(auth)).user;const fs=getFirestore(app);const uid=user.uid;const adminRef=doc(fs,'adminDevices',uid), approvedRef=doc(fs,'approvedDevices',uid), req=doc(fs,'deviceRequests',uid);
const admin=(await getDoc(adminRef)).exists();let started=false,stopCards=null,baseline={},pending=Promise.resolve(),ready=false;
panel.id='cloudPanel';const css=document.createElement('style');css.textContent='@media print{#cloudPanel{display:none!important}}';document.head.append(css);
const status=document.createElement('p');const controls=document.createElement('div');const heading=document.createElement('strong');panel.replaceChildren(heading,status,controls);
function button(parent,label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await fn()}catch(e){status.textContent='操作失敗: '+(e.code||e.message)}};parent.append(b);return b}
const clone=x=>JSON.parse(JSON.stringify(x));const id=k=>encodeURIComponent(k);const clean=v=>({days:Object.fromEntries(Object.entries(v.days||{}).filter(([d,r])=>Object.keys(r).length)),checker:v.checker||''});
const local=clone(db);db={};
function lock(){ready=false;$('manager').hidden=true;$('editor').hidden=true;if(stopCards){stopCards();stopCards=null}started=false;db={};baseline={};heading.textContent='承認待ち';status.textContent='親機で利用許可を受けてください。'}
window.cloudSave=()=>{if(!ready)return;let next=Object.fromEntries(Object.entries(db).map(([k,v])=>[k,clean(v)]));let old=baseline;baseline=clone(next);let ops=[];for(let k of Object.keys(old))if(!(k in next))ops.push(()=>deleteDoc(doc(fs,'timecards',id(k))));for(let [k,v] of Object.entries(next)){let prev=old[k];if(!prev){ops.push(()=>setDoc(doc(fs,'timecards',id(k)),{key:k,...v},{merge:true}));continue}let patch={};if(v.checker!==prev.checker)patch.checker=v.checker;for(let [d,r] of Object.entries(v.days))for(let [field,val] of Object.entries(r))if(val!==prev.days?.[d]?.[field])patch['days.'+d+'.'+field]=val;if(Object.keys(patch).length)ops.push(()=>updateDoc(doc(fs,'timecards',id(k)),patch));}if(!ops.length)return;status.textContent='同期中…';pending=pending.then(async()=>{for(let op of ops)await op();status.textContent='クラウド保存済み'}).catch(e=>{status.textContent='保存失敗: '+(e.code||e.message)+'。再読み込み前にバックアップしてください。';ready=false;});};
function start(){if(started)return;started=true;heading.textContent=admin?'親機・管理者':'利用許可済み';status.textContent='クラウド接続中…';stopCards=onSnapshot(collection(fs,'timecards'),{includeMetadataChanges:true},snap=>{if(snap.metadata.fromCache||snap.metadata.hasPendingWrites)return;let incoming={};snap.forEach(s=>{let v=s.data();if(typeof v.key==='string'&&v.days)incoming[v.key]=clean(v)});if(!ready){db=incoming;baseline=clone(incoming);ready=true;home();status.textContent='クラウド接続済み';if(admin&&Object.keys(local).some(k=>JSON.parse(k)[2]))button(controls,'端末内の旧データを取り込む',()=>{if(!confirm('クラウドに存在しない記録だけ取り込みますか？'))return;for(let [k,v] of Object.entries(local))if(JSON.parse(k)[2]&&!(k in db))db[k]=v;save();home()});return}pending.then(()=>{if(!ready)return;let editing=!$('editor').hidden;let k=editing?key():null;if(editing&&document.activeElement?.matches('input,select')){for(let [x,v] of Object.entries(incoming))if(x!==k)db[x]=v;return}db=incoming;baseline=clone(incoming);if(editing&&db[k])render();else home();});},e=>{lock();status.textContent='同期エラー: '+e.code});}
if(admin){start();let requests=document.createElement('div'),devices=document.createElement('div');controls.append(requests,devices);onSnapshot(collection(fs,'deviceRequests'),snap=>{requests.replaceChildren();let h=document.createElement('h3');h.textContent='承認申請 '+snap.size+'件';requests.append(h);snap.forEach(s=>{let row=document.createElement('p');row.textContent=(s.data().name||'端末')+' / '+s.id+' ';button(row,'許可',async()=>{let b=writeBatch(fs);b.set(doc(fs,'approvedDevices',s.id),{name:s.data().name||'端末'});b.delete(s.ref);await b.commit()});button(row,'拒否',()=>deleteDoc(s.ref));requests.append(row)})});onSnapshot(collection(fs,'approvedDevices'),snap=>{devices.replaceChildren();let h=document.createElement('h3');h.textContent='許可済み端末';devices.append(h);snap.forEach(s=>{let row=document.createElement('p');row.textContent=(s.data().name||'端末')+' ';button(row,'解除',async()=>{if(confirm('この端末の許可を解除しますか？'))await deleteDoc(s.ref)});devices.append(row)})});}else{lock();button(controls,'利用申請',async()=>{let name=prompt('端末の利用者名を入力');if(!name?.trim())return;if(!(await getDoc(req)).exists())await setDoc(req,{name:name.trim()});status.textContent='申請済み。親機の承認をお待ちください。'});onSnapshot(approvedRef,s=>{if(s.exists()){controls.hidden=true;start()}else{controls.hidden=false;lock()}},e=>{status.textContent=e.code});}
}catch(e){panel.textContent='端末認証エラー: '+(e.code||e.message)}
</script></html>
