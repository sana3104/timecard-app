<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タイムカード</title><style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#eef2f6;color:#182638;margin:0;padding:12px}main{max-width:1100px;margin:auto;background:white;padding:14px}h1{text-align:center;font-size:22px}header,footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}input,select,button{font:inherit;border:1px solid #aab5c3;border-radius:4px;background:white;padding:6px;color:inherit}button{background:#31577a;color:white;padding:10px 20px}table{border-collapse:collapse;width:100%;min-width:960px;table-layout:fixed}td,th{border:1px solid #999;text-align:center;padding:3px}th{background:#eee}td input,td select{width:100%;min-width:0;padding:4px 0} .pair{display:flex;align-items:center;gap:2px}.pair select{flex:1;width:0}.scroll{overflow-x:auto} .printval{display:none}footer{border:1px solid #999;padding:12px;justify-content:space-between} @page{size:A4 portrait;margin:8mm}@media print{body,main{padding:0;margin:0;background:white;color:black}h1{font-size:15pt;margin:0 0 3mm}header,footer{margin:2mm 0;padding:2mm;font-size:9pt}table{min-width:0;width:100%;font-size:8pt}td,th{padding:0 1px;height:6.7mm}th{height:8mm}input,select,.pair,button,.note{display:none!important}.printval{display:inline!important}.scroll{overflow:visible}footer{break-inside:avoid}tr{break-inside:avoid}}</style><main><h1>アルバイト タイムカード</h1><header><label>年 <select id="y"></select><span class="printval" id="py"></span></label><label>月 <select id="m"></select><span class="printval" id="pm"></span></label><label>氏名 <input id="name" placeholder="氏名"><span class="printval" id="pn"></span></label><button id="print">A4印刷</button></header><div class="scroll"><table><colgroup><col style="width:4%"><col style="width:4%"><col style="width:9%"><col style="width:25%"><col style="width:7%"><col style="width:8%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:18%"></colgroup><thead><tr><th>日</th><th>曜日</th><th>店舗</th><th>出勤・退勤</th><th>休憩</th><th>実働時間</th><th>欠勤</th><th>早退</th><th>遅刻</th><th>早朝</th><th>残業</th><th>交通費（区間・金額）</th></tr></thead><tbody id="rows"></tbody></table></div><footer><span>出勤日数 <b id="count">0日</b></span><span>実働合計 <b id="total">0時間00分</b></span><span>交通費合計 <b id="fare">0円</b></span><label>確認者 <input id="checker"><span class="printval" id="pc"></span></label></footer><p class="note">横にスクロールして入力できます。データはこのブラウザ内に保存されます。早退・遅刻・早朝・残業欄は記録用で、実働時間に重複加算しません。</p><p id="status" class="note"></p></main><script>
const $=id=>document.getElementById(id), now=new Date(), pad=n=>String(n).padStart(2,'0'), range=(a,b)=>Array.from({length:b-a+1},(_,i)=>i+a);
let db={};try{db=JSON.parse(localStorage.getItem('timecard-v3')||'{}')}catch(e){$('status').textContent='保存データを読み込めませんでした'}
function save(){try{localStorage.setItem('timecard-v3',JSON.stringify(db))}catch(e){$('status').textContent='自動保存できません。印刷して保管してください。'}}
function opts(el,values,blank=false){if(blank)el.add(new Option('―',''));values.forEach(v=>el.add(new Option(v,v)))}
opts($('y'),range(2020,2040));opts($('m'),range(1,12));$('y').value=now.getFullYear();$('m').value=now.getMonth()+1;
let current;function key(){return JSON.stringify([$('y').value,$('m').value,$('name').value.trim()])}
function fmt(n){return Math.floor(n/60)+'時間'+pad(n%60)+'分'}
function render(){current=db[key()]||(db[key()]={days:{},checker:''});$('checker').value=current.checker||'';$('rows').replaceChildren();$('py').textContent=$('y').value+'年';$('pm').textContent=$('m').value+'月';$('pn').textContent=$('name').value;$('pc').textContent=$('checker').value;let y=+$('y').value,m=+$('m').value;for(let d=1;d<=new Date(y,m,0).getDate();d++){let r=current.days[d]||(current.days[d]={}),tr=$('rows').insertRow();tr.insertCell().textContent=d;tr.insertCell().textContent='日月火水木金土'[new Date(y,m-1,d).getDay()];function field(parent,k,values,type='text'){let el=document.createElement(values?'select':'input');if(values)opts(el,values,true);else el.type=type;el.value=r[k]??'';let p=document.createElement('span');p.className='printval';p.textContent=el.value;parent.append(el,p);el.addEventListener('input',()=>{r[k]=el.value;p.textContent=el.value;save();calc()});return el}
field(tr.insertCell(),'store',['Lucia','Glanz','Sara']);let c=tr.insertCell(),pair=document.createElement('div');pair.className='pair';c.append(pair);for(let k of ['sh','sm','eh','em']){if(k==='sm'||k==='em')pair.append(':');if(k==='eh')pair.append('〜');field(pair,k,range(0,k.endsWith('h')?23:59).map(pad))}let p=document.createElement('span');p.className='printval';p.id='time'+d;c.append(p);field(tr.insertCell(),'rest',range(0,120).map(String));tr.insertCell().id='work'+d;field(tr.insertCell(),'absent',['欠']);for(let k of ['early','late','before','over'])field(tr.insertCell(),k,range(0,180).map(String));let f=tr.insertCell();field(f,'route');field(f,'fare',null,'number')}calc()}
function calc(){let count=0,total=0,fare=0;for(let [d,r] of Object.entries(current.days)){let w=$('work'+d);if(!w)continue;let t=$('time'+d);t.textContent=[r.sh,r.sm,r.eh,r.em].every(v=>v!=null&&v!=='')?r.sh+':'+r.sm+'〜'+r.eh+':'+r.em:'';let complete=[r.sh,r.sm,r.eh,r.em].every(v=>v!=null&&v!=='');let n=(+r.eh-+r.sh)*60+(+r.em-+r.sm)-Number(r.rest||0);w.textContent='';if(complete&&!r.absent){if(n>0){count++;total+=n;w.textContent=Math.floor(n/60)+':'+pad(n%60)}else w.textContent='要確認'}fare+=Math.max(0,Number(r.fare)||0)}$('count').textContent=count+'日';$('total').textContent=fmt(total);$('fare').textContent=fare.toLocaleString()+'円'}
$('y').onchange=$('m').onchange=$('name').onchange=render;$('checker').oninput=()=>{current.checker=$('checker').value;$('pc').textContent=current.checker;save()};$('print').onclick=()=>{save();window.print()};render();
</script></html>
